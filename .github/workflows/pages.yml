name: Gauge editor Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/test_web_editor.mjs', '.github/workflows/pages.yml', 'Sources/OverlayCore/Rendering/OverlayLayout.swift', 'Sources/OverlayCore/Rendering/OverlayRenderer.swift', 'Sources/OverlayCore/Rendering/OverlayRenderConfig.swift', 'Sources/OverlayCore/Rendering/OverlayTimeZone.swift', 'Sources/OverlayCore/Telemetry/**', 'Sources/OverlayCore/FIT/**']
  pull_request:
    paths: ['web/**', 'scripts/test_web_editor.mjs', '.github/workflows/pages.yml', 'Sources/OverlayCore/Rendering/OverlayLayout.swift', 'Sources/OverlayCore/Rendering/OverlayRenderer.swift', 'Sources/OverlayCore/Rendering/OverlayRenderConfig.swift', 'Sources/OverlayCore/Rendering/OverlayTimeZone.swift', 'Sources/OverlayCore/Telemetry/**', 'Sources/OverlayCore/FIT/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gauge-editor-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check editor modules and native JSON compatibility
        run: |
          for file in web/*.mjs; do node --check "$file"; done
          npm --prefix web run test:unit
      - name: Check audited file boundary
        run: python3 -B scripts/check_source_boundary.py
      - name: Install browser test tools
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Firefox and WebKit
        working-directory: web
        run: npx playwright install --with-deps firefox webkit
      - name: Check all languages and browser editing workflows
        working-directory: web
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gauge-editor-browser-failures
          path: web/test-results/
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare runtime files only
        run: node web/prepare-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .build/gauge-pages
      - uses: actions/deploy-pages@v4
        id: deployment
