name: Gauge editor Pages
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/test_web_editor.mjs', '.github/workflows/pages.yml', 'Sources/OverlayCore/Rendering/OverlayLayout.swift', 'Sources/OverlayCore/Rendering/OverlayRenderer.swift', 'Sources/OverlayCore/Rendering/OverlayRenderConfig.swift']
  pull_request:
    paths: ['web/**', 'scripts/test_web_editor.mjs', '.github/workflows/pages.yml', 'Sources/OverlayCore/Rendering/OverlayLayout.swift', 'Sources/OverlayCore/Rendering/OverlayRenderer.swift', 'Sources/OverlayCore/Rendering/OverlayRenderConfig.swift']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gauge-editor-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check editor modules and native JSON compatibility
        run: |
          for file in web/*.mjs; do node --check "$file"; done
          node --test scripts/test_web_editor.mjs
      - name: Check audited file boundary
        run: python3 -B scripts/check_source_boundary.py
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
