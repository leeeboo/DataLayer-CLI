name: CLI · macOS / Windows / Linux
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLI_RELEASE_VERSION: v0.1.1
concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare one shared moved project with synthetic media
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -B scripts/prepare_export_fixture.py export-fixture
      - uses: actions/upload-artifact@v7
        with:
          name: shared-export-fixture
          path: export-fixture/
          retention-days: 7
  test:
    needs: fixture
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Check audited source boundary
        run: |
          python3 -B scripts/test_source_boundary.py
          python3 -B scripts/test_release_checks.py
      - name: Build release CLI
        run: swift build -c release --product overlay
      - name: Run all core and CLI tests
        run: swift test
      - name: Check command entry point
        run: .build/release/overlay --help
      - name: Install media inspection runtime
        run: command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Export saved project and inspect picture, timing, audio and Alpha
        run: python3 -B scripts/verify_export_fixture.py .build/release/overlay export-fixture export-macos
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-macos
          path: export-macos/
          retention-days: 7
  linux:
    needs: fixture
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Install portable media and graphics runtimes
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git ffmpeg libcairo2 libpangocairo-1.0-0 fonts-liberation fonts-dejavu-core
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          apt-get upgrade -y
          env -u GIT_CONFIG_GLOBAL -u GIT_CONFIG_SYSTEM git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check audited source boundary
        run: |
          python3 -B scripts/test_source_boundary.py
          python3 -B scripts/test_release_checks.py
      - name: Build release CLI
        run: swift build -c release --product overlay -j 4
      - name: Run shared and portable media regressions
        run: swift test -j 4
      - name: Check command entry point
        run: .build/release/overlay --help
      - name: Collect Linux runtime, notices and matching package sources
        run: python3 -B scripts/collect_portable_runtime.py .build/release/overlay .build/portable-runtime .build/dependency-sources
      - name: Package and unpack the native Linux release
        run: |
          python3 -B scripts/package_portable_release.py "$CLI_RELEASE_VERSION" .build/release/overlay .build/releases .build/portable-runtime .build/dependency-sources
          (cd .build/releases && sha256sum -c *.sha256)
          mkdir -p .build/package-smoke
          tar -xzf ".build/releases/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64.tar.gz" -C .build/package-smoke
          ".build/package-smoke/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64/overlay" --help
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            .build/releases/*.tar.gz
            .build/releases/*.tar.gz.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: sources-linux
          path: |
            .build/releases/*-dependency-sources.tar
            .build/releases/*-dependency-sources.tar.sha256
          retention-days: 7
  linux-clean:
    needs: [fixture, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: package
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Export in Ubuntu without Swift, FFmpeg, Cairo or Pango installed
        run: |
          (cd package && sha256sum -c *.sha256)
          tar -xzf package/*.tar.gz -C package
          docker run --rm -e CLI_RELEASE_VERSION -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:24.04 sh -ec '
            apt-get update && apt-get install -y --no-install-recommends python3
            python3 -B scripts/verify_portable_package.py "package/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64" export-fixture export-linux
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-linux
          path: export-linux/
          retention-days: 7
  windows:
    needs: fixture
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Swift and Windows SDK
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - name: Install native Windows media and graphics runtimes
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-ttf-dejavu
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
      - name: Make runtime DLLs available to the native Swift executable
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_LOCATION\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check audited source boundary
        run: |
          python -B scripts/test_source_boundary.py
          python -B scripts/test_release_checks.py
      - name: Build release CLI
        run: swift build -c release --product overlay -j 4
      - name: Run shared and portable media regressions
        run: swift test -j 4
      - name: Check command entry point
        shell: pwsh
        run: |
          $binary = Join-Path (swift build -c release --show-bin-path) 'overlay.exe'
          & $binary --help
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Verify the development runtime before collecting the portable package
        shell: pwsh
        run: |
          $binary = Join-Path (swift build -c release --show-bin-path) 'overlay.exe'
          python -B scripts/verify_export_fixture.py $binary export-fixture export-development-windows
      - name: Collect Windows runtime, notices and matching package sources
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $binary = Join-Path (swift build -c release --show-bin-path) 'overlay.exe'
          python -B scripts/collect_portable_runtime.py $binary .build/portable-runtime .build/dependency-sources
          if ($LASTEXITCODE -ne 0) { throw 'Runtime collection failed' }
      - name: Package and unpack the native Windows release
        shell: pwsh
        run: |
          $binary = Join-Path (swift build -c release --show-bin-path) 'overlay.exe'
          python -B scripts/package_portable_release.py $env:CLI_RELEASE_VERSION $binary .build/releases .build/portable-runtime .build/dependency-sources
          if ($LASTEXITCODE -ne 0) { throw 'Runtime packaging failed' }
          $archive = ".build/releases/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64.zip"
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive $archive .build/package-smoke
          & ".build/package-smoke/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64/overlay.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI could not start' }
          # Source/archive and extracted runtime copies are retained; remove duplicate staging before real exports.
          Remove-Item -LiteralPath .build/dependency-sources,.build/portable-runtime -Recurse -Force
          $compiled = Split-Path (Split-Path $binary -Parent) -Parent
          if ((Split-Path $compiled -Parent) -ne (Resolve-Path .build).Path -or (Split-Path $compiled -Leaf) -notmatch '^x86_64-.*windows') { throw 'Unexpected compiler scratch path' }
          Remove-Item -LiteralPath $compiled -Recurse -Force
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            .build/releases/*.zip
            .build/releases/*.zip.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: sources-windows
          path: |
            .build/releases/*-dependency-sources.tar
            .build/releases/*-dependency-sources.tar.sha256
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-development-export
          path: export-development-windows/
          retention-days: 7
  windows-clean:
    needs: [fixture, windows]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: package
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Check and extract the downloaded Windows package
        shell: pwsh
        run: |
          $archive = "package/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64.zip"
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive $archive .build/package-smoke
      - name: Export saved project and inspect picture, timing, audio and Alpha
        id: portable-export
        shell: pwsh
        run: |
          python -B scripts/verify_portable_package.py ".build/package-smoke/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64" export-fixture export-windows
      - name: Diagnose the bundled executable independently of its launcher
        if: failure() && steps.portable-export.outcome == 'failure'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $package = (Resolve-Path ".build/package-smoke/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64 QA 空格 &").Path
          $env:PATH = "$package\runtime\bin;$env:SystemRoot\System32"
          $env:FONTCONFIG_FILE = "$package\runtime\fonts.conf"
          & $python -B scripts/verify_export_fixture.py "$package\runtime\bin\overlay.exe" export-fixture export-direct-windows
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-windows
          path: export-windows/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-runtime-controls
          path: export-direct-windows/
          retention-days: 7
  compare:
    needs: [test, linux-clean, windows-clean]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: comparison-runtime
      - name: Use the verified bundled media comparison runtime
        run: |
          (cd comparison-runtime && sha256sum -c *.sha256)
          tar -xzf comparison-runtime/*.tar.gz -C comparison-runtime
          runtime="$PWD/comparison-runtime/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64/runtime"
          echo "$runtime/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$runtime/lib" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: export-*
          path: exports
      - name: Gate portable picture and Alpha, gate all audio, report Apple appearance differences
        run: python3 -B scripts/compare_export_fixture.py exports comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-comparison
          path: comparison.json
          retention-days: 7
