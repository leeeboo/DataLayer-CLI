name: CLI CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CLI_RELEASE_VERSION: v0.1.0
concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare one shared moved project with synthetic media
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -B scripts/prepare_export_fixture.py export-fixture
      - uses: actions/upload-artifact@v7
        with:
          name: shared-export-fixture
          path: export-fixture/
          retention-days: 7
  test:
    needs: fixture
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: swift --version
      - name: Check audited source boundary
        run: |
          python3 -B scripts/test_source_boundary.py
          python3 -B scripts/test_release_checks.py
      - name: Build release CLI
        run: swift build -c release --product overlay
      - name: Run all core and CLI tests
        run: swift test
      - name: Check command entry point
        run: python3 -B scripts/test_cli_output.py .build/release/overlay
      - name: Install media inspection runtime
        run: command -v ffmpeg || brew install ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Export saved project and inspect picture, timing, audio and Alpha
        run: python3 -B scripts/verify_export_fixture.py .build/release/overlay export-fixture export-macos
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-macos
          path: export-macos/
          retention-days: 7
  linux:
    needs: fixture
    runs-on: ubuntu-24.04
    container: swift:6.1.2-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install portable media and graphics runtimes
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git ffmpeg libcairo2 libpangocairo-1.0-0 fonts-liberation fonts-dejavu-core
          env -u GIT_CONFIG_GLOBAL -u GIT_CONFIG_SYSTEM git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check audited source boundary
        run: |
          python3 -B scripts/test_source_boundary.py
          python3 -B scripts/test_release_checks.py
      - name: Build release CLI
        run: swift build -c release --product overlay -j 4
      - name: Run shared and portable media regressions
        run: swift test -j 4
      - name: Check command entry point
        run: python3 -B scripts/test_cli_output.py .build/release/overlay
      - name: Package and unpack the native Linux release
        run: |
          python3 -B scripts/package_portable_release.py "$CLI_RELEASE_VERSION" .build/release/overlay .build/releases
          (cd .build/releases && sha256sum -c *.sha256)
          mkdir -p .build/package-smoke
          tar -xzf ".build/releases/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64.tar.gz" -C .build/package-smoke
          ".build/package-smoke/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64/overlay" --help
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Export saved project and inspect picture, timing, audio and Alpha
        run: python3 -B scripts/verify_export_fixture.py ".build/package-smoke/DataLayer-CLI-${CLI_RELEASE_VERSION}-Linux-x86_64/overlay" export-fixture export-linux
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: .build/releases/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-linux
          path: export-linux/
          retention-days: 7
  windows:
    needs: fixture
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Swift and Windows SDK
        uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE
      - name: Install native Windows media and graphics runtimes
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-ttf-dejavu
      - name: Make runtime DLLs available to the native Swift executable
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_LOCATION\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check audited source boundary
        run: |
          python -B scripts/test_source_boundary.py
          python -B scripts/test_release_checks.py
      - name: Build release CLI
        run: swift build -c release --product overlay -j 4
      - name: Run shared and portable media regressions
        run: swift test -j 4
      - name: Check command entry point
        shell: pwsh
        run: |
          $binary = Join-Path (swift build -c release --show-bin-path) 'overlay.exe'
          python -B scripts/test_cli_output.py $binary
      - name: Package and unpack the native Windows release
        shell: pwsh
        run: |
          $binary = Join-Path (swift build -c release --show-bin-path) 'overlay.exe'
          python -B scripts/package_portable_release.py $env:CLI_RELEASE_VERSION $binary .build/releases
          $archive = ".build/releases/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64.zip"
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Archive checksum mismatch' }
          Expand-Archive $archive .build/package-smoke
          & ".build/package-smoke/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64/overlay.exe" --help
      - uses: actions/download-artifact@v8
        with:
          name: shared-export-fixture
          path: export-fixture
      - name: Export saved project and inspect picture, timing, audio and Alpha
        shell: pwsh
        run: |
          $binary = ".build/package-smoke/DataLayer-CLI-$env:CLI_RELEASE_VERSION-Windows-x86_64/overlay.exe"
          python -B scripts/verify_export_fixture.py $binary export-fixture export-windows
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: .build/releases/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-windows
          path: export-windows/
          retention-days: 7
  compare:
    needs: [test, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install media comparison runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/download-artifact@v8
        with:
          pattern: export-*
          path: exports
      - name: Gate portable picture and Alpha, gate all audio, report Apple appearance differences
        run: python3 -B scripts/compare_export_fixture.py exports comparison.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-comparison
          path: comparison.json
          retention-days: 7
