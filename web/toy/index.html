<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; media-src blob:">
  <title>Overlay 数据层预览</title>
  <link rel="stylesheet" href="./toy/style.css">
  <script type="module" src="./toy/preview.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Overlay 数据层预览</h1>
      <p>在本机选择 FIT 和视频，文件不会上传。</p>
    </header>

    <div class="sources">
      <div class="source">
        <label for="fit-file">选择 FIT</label>
        <input id="fit-file" type="file">
        <p id="fit-status" role="status">选择运动设备导出的 .fit 文件</p>
      </div>
      <div class="source">
        <label for="video-file">选择视频</label>
        <input id="video-file" type="file" accept="video/*,.mp4,.mov,.m4v,.webm">
        <p id="video-status" role="status">推荐 H.264 编码的 MP4</p>
      </div>
    </div>

    <div class="stage" id="stage">
      <p id="placeholder">选择视频后在这里预览</p>
      <video id="video" playsinline preload="metadata" hidden></video>
      <svg id="overlay" aria-hidden="true"></svg>
    </div>

    <div class="transport">
      <button id="play" type="button" disabled>播放</button>
      <input id="seek" type="range" min="0" max="0" step="any" value="0" aria-label="视频进度" disabled>
      <span id="video-time" class="time">0:00 / 0:00</span>
    </div>

    <section class="alignment" aria-label="时间对齐">
      <div>
        <label for="offset">时间偏移（秒）</label>
        <p id="offset-hint">视频第 0 秒对应 FIT 的时间。正值取更晚的数据。</p>
      </div>
      <input id="offset" type="number" step="0.1" value="0" aria-describedby="offset-hint" disabled>
      <p id="sync-status" role="status" hidden></p>
    </section>
  </main>
</body>
</html>
